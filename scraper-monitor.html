<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justice Watch Scraper Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }
        .status-running { background: #4ade80; }
        .status-idle { background: #94a3b8; }
        .status-error { background: #f87171; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .control-panel {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid transparent;
        }
        .log-info { border-left-color: #3b82f6; }
        .log-success { border-left-color: #4ade80; }
        .log-error { border-left-color: #f87171; }
        .log-warning { border-left-color: #fbbf24; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #3b82f6);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕷️ Justice Watch Scraper Monitor</h1>
        
        <div class="status-card">
            <h2>
                <span class="status-indicator status-idle" id="statusIndicator"></span>
                Status: <span id="statusText">Ready</span>
            </h2>
            <p>Docker Container: <code>justice-scraper:test</code></p>
            <p>Target: Maricopa County Justice Courts</p>
        </div>
        
        <div class="control-panel">
            <button id="startBtn" onclick="startScraping()">▶️ Start Scraping</button>
            <button id="stopBtn" onclick="stopScraping()" disabled>⏹️ Stop</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
            <button onclick="exportData()">📥 Export Data</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%">
                0%
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="courtsCount">0</div>
                <div class="stat-label">Courts Discovered</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="casesCount">0</div>
                <div class="stat-label">Cases Found</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="elapsedTime">00:00</div>
                <div class="stat-label">Elapsed Time</div>
            </div>
        </div>
        
        <h3>📜 Live Logs</h3>
        <div class="log-container" id="logContainer">
            <div class="log-entry log-info">🚀 Scraper monitor ready. Click "Start Scraping" to begin.</div>
        </div>
    </div>
    
    <script>
        let isRunning = false;
        let startTime = null;
        let logSocket = null;
        let stats = {
            courts: 0,
            cases: 0,
            errors: 0,
            total: 26  // Total courts
        };
        
        function startScraping() {
            isRunning = true;
            startTime = Date.now();
            
            document.getElementById('statusIndicator').className = 'status-indicator status-running';
            document.getElementById('statusText').textContent = 'Running';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            addLog('info', '🚀 Starting scraper...');
            addLog('info', 'Executing: docker run justice-scraper:test');
            
            // Simulate WebSocket connection for real-time updates
            connectToScraper();
            
            // Start timer
            updateTimer();
        }
        
        function stopScraping() {
            isRunning = false;
            
            document.getElementById('statusIndicator').className = 'status-indicator status-idle';
            document.getElementById('statusText').textContent = 'Stopped';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            addLog('warning', '⏹️ Scraping stopped by user');
            
            if (logSocket) {
                logSocket.close();
            }
        }
        
        function connectToScraper() {
            // In production, this would connect to WebSocket
            // For now, simulate scraper progress
            simulateScraperProgress();
        }
        
        function simulateScraperProgress() {
            const courts = [
                'Agua Fria', 'Arrowhead', 'Buckeye', 'Canyon', 'Chandler',
                'Country Meadows', 'Deer Valley', 'Desert Ridge', 'Downtown',
                'East Mesa', 'Encanto', 'Estrella Mountain', 'Fountain Hills'
            ];
            
            let currentCourt = 0;
            
            const interval = setInterval(() => {
                if (!isRunning || currentCourt >= courts.length) {
                    clearInterval(interval);
                    if (currentCourt >= courts.length) {
                        completeScraping();
                    }
                    return;
                }
                
                const courtName = courts[currentCourt];
                addLog('info', `🏛️ Processing ${courtName} Justice Court...`);
                
                // Simulate finding cases
                setTimeout(() => {
                    const casesFound = Math.floor(Math.random() * 5);
                    if (casesFound > 0) {
                        addLog('success', `✅ Found ${casesFound} arraignment case(s) in ${courtName}`);
                        stats.cases += casesFound;
                        document.getElementById('casesCount').textContent = stats.cases;
                    } else {
                        addLog('info', `No arraignments in ${courtName}`);
                    }
                    
                    stats.courts++;
                    document.getElementById('courtsCount').textContent = stats.courts;
                    
                    // Update progress
                    const progress = Math.round((stats.courts / stats.total) * 100);
                    document.getElementById('progressBar').style.width = progress + '%';
                    document.getElementById('progressBar').textContent = progress + '%';
                    
                    // Update success rate
                    const successRate = stats.courts > 0 ? 
                        Math.round((stats.courts - stats.errors) / stats.courts * 100) : 0;
                    document.getElementById('successRate').textContent = successRate + '%';
                    
                }, 1000);
                
                currentCourt++;
            }, 3000);
        }
        
        function completeScraping() {
            isRunning = false;
            document.getElementById('statusIndicator').className = 'status-indicator status-idle';
            document.getElementById('statusText').textContent = 'Completed';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            addLog('success', '🎉 Scraping completed successfully!');
            addLog('info', `📊 Total: ${stats.courts} courts processed, ${stats.cases} cases found`);
        }
        
        function addLog(type, message) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logContainer').innerHTML = 
                '<div class="log-entry log-info">🚀 Logs cleared. Ready for new session.</div>';
        }
        
        function exportData() {
            const data = {
                timestamp: new Date().toISOString(),
                stats: stats,
                logs: Array.from(document.querySelectorAll('.log-entry'))
                    .map(e => e.textContent)
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], 
                {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `scraper-data-${Date.now()}.json`;
            a.click();
            
            addLog('success', '📥 Data exported successfully');
        }
        
        function updateTimer() {
            if (!isRunning) return;
            
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            
            document.getElementById('elapsedTime').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            setTimeout(updateTimer, 1000);
        }
        
        // Check if WebSocket is available (for real implementation)
        if (window.location.port === '3001') {
            addLog('info', '📡 Connected to backend at port 3001');
        }
    </script>
</body>
</html>
