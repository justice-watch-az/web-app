# Justice Watch — court / booking sources registry
# Enable sources carefully; each adapter is an independent failure domain.

sources:
  - id: maricopa_jc
    enabled: true
    type: justice_court_calendar
    county: maricopa
    adapter: maricopa_jc
    schedule: "0 16 * * 1-5"  # ~9 AM MST weekdays (existing workflow)
    notes: >
      Existing Selenium scraper against justicecourts.maricopa.gov CourtCalendars.
      Discovers all 26 JC precincts dynamically.

  - id: maricopa_mcso_booking
    enabled: true
    type: jail_booking_wall
    county: maricopa
    adapter: mcso_booking
    schedule: "7 */2 * * *"
    notes: >
      MCSO mugshot wall → mcso_bookings (DUI-only). Separate table from cases.

  - id: pima_jc
    enabled: true  # wired 2026-08-18; DUI-native (Criminal DUI + Criminal Arraignment, no-attorney)
    type: justice_court_calendar
    county: pima
    adapter: pima_jc
    court_name: Pima County Consolidated Justice Court
    entrypoints:
      - https://www.jp.pima.gov/NewCalendar2018/
    schedule: "30 16 * * 1-5"
    notes: >
      ASP.NET calendar with native Criminal DUI case-type filter and event-type
      filter. Lead gate: Criminal Arraignment + empty attorney field
      (unrepresented = Steve's Maricopa Long-Form rule, Pima edition).
      No captcha on calendar; reachable from datacenter egress.

  - id: yavapai_ycso_booking
    enabled: true  # scraper + workflow live; writes ycso_bookings (unclassified until enrichment)
    type: jail_booking_roster
    county: yavapai
    court_name: Yavapai County Sheriff's Office Detention
    entrypoints:
      - https://apps.yavapaiaz.gov/InmateSearch/
    schedule: "22 */2 * * *"  # every 2h, offset from MCSO wall
    sink: ycso_bookings
    notes: >
      Name-search-only roster swept a-z; current-inmates so 2h polling catches
      book-and-release DUIs. No charges on roster — is_dui stays NULL until
      charge_enrichment confirms. No public UI surface until then (DUI-only rule).

  - id: yavapai_jc_prescott
    enabled: true  # wired 2026-08-18 (JWAZ-16); requires JWAZ-14 migration applied
    type: justice_court_calendar
    county: yavapai
    adapter: yavapai_jc
    court_name: Prescott Justice Court
    entrypoints:
      - https://apps.yavapaiaz.gov/Courtcalendar_PCC/
    schedule: "15 16 * * 1-5"
    notes: >
      ASP.NET WebForms calendar grid (Case Number, Session Date, Party Name, Court Room).
      courts.yavapaiaz.gov is 403 from datacenter IPs — do not use as primary entry.
      Charge/DUI text not on grid; enrichment TBD.

  # Placeholders — URLs unconfirmed (guessed Courtcalendar_* paths 404)
  - id: yavapai_jc_verde_valley
    enabled: false
    type: justice_court_calendar
    county: yavapai
    adapter: yavapai_jc
    court_name: Verde Valley Justice Court
    entrypoints: []
    notes: Calendar app path not yet discovered.

  - id: yavapai_jc_mayer
    enabled: false
    type: justice_court_calendar
    county: yavapai
    adapter: yavapai_jc
    court_name: Mayer Justice Court
    entrypoints: []
