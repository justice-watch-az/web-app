version: '3.8'

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    image: justice-scraper:test
    container_name: justice-scraper-test
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_MOCK_SCRAPER=${USE_MOCK:-false}
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - TEST_MODE=true
    networks:
      - justice-network
    depends_on:
      - redis
      - selenium
    volumes:
      - ./scrapers:/app/scrapers:ro
      - ./test-results:/app/test-results
    command: ["/app/scrapers/test_scraper_integration.py"]
    
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium-hub
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC port for debugging
    environment:
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_VNC_NO_PASSWORD=1
    networks:
      - justice-network
    shm_size: 2gb
    
  redis:
    image: redis:7-alpine
    container_name: test-redis
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    networks:
      - justice-network
      
networks:
  justice-network:
    driver: bridge