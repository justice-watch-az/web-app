---
version: "2.0"

services:
  redis:
    image: redis:7-alpine
    expose:
      - port: 6379
        as: 6379
        to:
          - service: app
    params:
      storage:
        redis-data:
          mount: /data
          readOnly: false

  app:
    image: your-dockerhub-username/justice-watch-app:production
    env:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPABASE_URL=your-supabase-url
      - SUPABASE_ANON_KEY=your-anon-key
      - SUPABASE_SERVICE_KEY=your-service-key
      - SESSION_SECRET=your-session-secret
    expose:
      - port: 3001
        as: 80
        to:
          - global: true
    depends_on:
      - redis

profiles:
  compute:
    redis:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - size: 5Gi
            name: redis-data
    app:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage:
          - size: 10Gi

  placement:
    akash:
      attributes:
        host: akash
      signedBy:
        anyOf:
          - "akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63"
          - "akash18qa2a2ltfyvkyj0ggj3hkvuj6twzyumuaru9s4"
      pricing:
        redis:
          denom: uakt
          amount: 100
        app:
          denom: uakt
          amount: 500

deployment:
  redis:
    akash:
      profile: redis
      count: 1
  app:
    akash:
      profile: app
      count: 1