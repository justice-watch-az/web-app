name: Scrape Maricopa Courts

on:
  schedule:
    # Run at 9 AM MST (4 PM UTC) Monday-Friday
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false

jobs:
  scrape:
    runs-on: macos-latest  # Using macOS for better anti-bot evasion
    timeout-minutes: 30
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Chrome
      run: |
        brew install --cask google-chrome
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scrapers/requirements.txt
        
    - name: Run scraper
      run: |
        cd scrapers
        python maricopa_arraignment_scraper.py '{"headless": true, "stealth_mode": true}'
      env:
        PYTHONUNBUFFERED: "1"
        
    - name: Upload scraper logs
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: scraper-logs
        path: |
          scrapers/*.log
          scrapers/debug/
          
    - name: Notify on failure
      if: failure()
      run: |
        echo "Scraper failed! Check logs for details."
        # Add Slack/Discord notification here if needed