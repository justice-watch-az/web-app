version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: justice-watch:v3.3
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3001:3001"
      - "5173:5173"
    env_file:
      - .env.production
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./src:/app/src
      - ./public:/app/public
      - ./scrapers:/app/scrapers
      - /app/node_modules
    command: npm run dev

volumes:
  redis_data: