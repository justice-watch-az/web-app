<!DOCTYPE html>
<html>
<head>
    <title>Test Data Display</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #f0f0f0; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Justice Watch - Test Data Display</h1>
    
    <div id="stats" class="stats">
        <div class="stat-card">Total Cases: <span id="total">Loading...</span></div>
        <div class="stat-card">Judges: <span id="judges">Loading...</span></div>
        <div class="stat-card">Open: <span id="open">Loading...</span></div>
        <div class="stat-card">Closed: <span id="closed">Loading...</span></div>
    </div>
    
    <h2>Cases from Supabase:</h2>
    <table id="cases">
        <thead>
            <tr>
                <th>Case Number</th>
                <th>Court</th>
                <th>Title</th>
                <th>Type</th>
                <th>Status</th>
                <th>Judge</th>
                <th>Filing Date</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7">Loading...</td></tr>
        </tbody>
    </table>
    
    <script>
        // Test both local API and direct Supabase
        const API_URL = 'http://localhost:3001/api';
        
        async function loadData() {
            try {
                // Load cases
                const casesRes = await fetch(`${API_URL}/cases`);
                const casesData = await casesRes.json();
                const cases = casesData.cases || [];
                
                console.log('Loaded cases:', cases.length);
                
                // Display cases
                const tbody = document.querySelector('#cases tbody');
                if (cases.length > 0) {
                    tbody.innerHTML = cases.map(c => `
                        <tr>
                            <td>${c.case_number}</td>
                            <td>${c.court_name || 'N/A'}</td>
                            <td>${c.case_title || 'No Title'}</td>
                            <td>${c.case_type || 'N/A'}</td>
                            <td>${c.status || 'N/A'}</td>
                            <td>${c.judge || 'N/A'}</td>
                            <td>${c.filing_date ? new Date(c.filing_date).toLocaleDateString() : 'N/A'}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7">No cases found</td></tr>';
                }
                
                // Load stats
                const statsRes = await fetch(`${API_URL}/cases/statistics`);
                const stats = await statsRes.json();
                
                document.getElementById('total').textContent = stats.total_cases || 0;
                document.getElementById('judges').textContent = stats.total_judges || 0;
                document.getElementById('open').textContent = stats.open_cases || 0;
                document.getElementById('closed').textContent = stats.closed_cases || 0;
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.querySelector('#cases tbody').innerHTML = 
                    `<tr><td colspan="7">Error: ${error.message}</td></tr>`;
            }
        }
        
        // Load data on page load
        loadData();
        
        // Also test direct Supabase
        const SUPABASE_URL = 'https://tsgvxobkmmvsbjzxvuas.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzZ3Z4b2JrbW12c2Jqenh2dWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUxMDYwMTAsImV4cCI6MjA3MDY4MjAxMH0.1o4qm0ZgHNBE-5bA-aUUcBW9VVX8vYhMpGOZXwvhzQE';
        
        fetch(`${SUPABASE_URL}/rest/v1/cases?select=*&limit=5`, {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`
            }
        })
        .then(res => res.json())
        .then(data => {
            console.log('Direct Supabase query:', data);
        })
        .catch(err => console.error('Supabase error:', err));
    </script>
</body>
</html>
