# Netlify Configuration for Justice Watch

[build]
  # Build command for React app
  command = "npm run build"
  
  # Directory to deploy (Vite output)
  publish = "dist"

# Environment variables (configured in Netlify dashboard)
[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://yylmsozhbhqebywavlzr.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bG1zb3poYmhxZWJ5d2F2bHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU0OTAzMTAsImV4cCI6MjA3MTA2NjMxMH0.I8osluXaXa4KOiRQ1JZrccFMY3F9Qpd4UelYQcMVpv0"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Remove API proxy since we connect directly to Supabase
# No backend proxy needed for serverless architecture

# Serverless functions directory
[functions]
  directory = "netlify/functions"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"